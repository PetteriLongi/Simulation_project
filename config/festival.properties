# Visitor arrivals
arrival.seed=5

# Service-time distributions
# For Normal, variance is the second parameter (not standard deviation)
service.entrance.mean=1.5
service.entrance.variance=0.0625

service.bar.mean=10.0
service.bar.variance=10.0

service.toilet.mean=5.0
service.toilet.variance=3.0

# Routing weights
routing.entrance.bar=40
routing.entrance.toilet=40
routing.entrance.exited=20
routing.entrance.stage=25

routing.bar.bar=10
routing.bar.toilet=40
routing.bar.exited=50
routing.bar.stage=25

routing.toilet.bar=40
routing.toilet.toilet=10
routing.toilet.exited=50
routing.toilet.stage=25

visitor.maxActivities=5

# Stage schedule; times are in minutes
stage.capacity=100
stage.firstShowStart=15
stage.showDuration=45
stage.breakDuration=15

# Routing after a stage visit
routing.stage.bar=30
routing.stage.toilet=20
routing.stage.stage=25
routing.stage.exited=25